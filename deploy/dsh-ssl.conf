# DeepSeek Harness Web UI — SSL 反向代理 + Basic Auth
#
# 作用：把只监听 127.0.0.1:18080 的 dsh web 服务安全地暴露到公网。
#   - dsh 自身无内置认证，公网直连等于把 shell 交给所有人
#   - 因此在 nginx 层加 basic auth 作为"密码门"
#   - SSL 用于避免 basic auth 的凭据在链路上明文传输（这是必须上 HTTPS 的原因）
#
# ⚠️ 脱敏版：部署前把 <SERVER_HOST> / <PORT> 换成你自己的值，证书路径按实际情况改。

server {
    listen <PORT> ssl;
    server_name <SERVER_HOST>;

    # 自签证书即可（个人自用）；正式域名建议换 Let's Encrypt
    ssl_certificate     /etc/nginx/ssl/your-cert.crt;
    ssl_certificate_key /etc/nginx/ssl/your-cert.key;

    # 密码门：无凭据一律 401
    # 生成：htpasswd -c /etc/dsh/htpasswd <用户名>
    # （htpasswd 来自 httpd-tools / apache2-utils 包）
    auth_basic "DeepSeek Harness";
    auth_basic_user_file /etc/dsh/htpasswd;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;

        # ⚠️ 必须带端口：dsh 有 trusted-host 校验（防 DNS rebinding），
        #    只传 $host 会丢掉端口，导致 403 围栏拒绝。
        proxy_set_header Host $host:$server_port;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级（dsh 前端有长连接）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
    }
}

# ─────────────────────────────────────────────────────────────
#  踩坑记录
# ─────────────────────────────────────────────────────────────
#
# 1. 不要试图把 dsh 挂到子路径（如 /dsh/）反向代理。
#    dsh 前端资源引用的是绝对路径，挂子路径后资源全部 404。
#    要暴露就给独立端口或独立域名。
#
# 2. /api 下的部分特权方法（settings / credentials / llm.discoverModels 等）
#    在 dsh 里被硬编码为仅允许 loopback 调用，远程访问一律 403。
#    这是它的安全设计，不要试图绕过。
#
# 3. basic auth 凭据是「长期共享密码」，没有失效机制。
#    若这条通道要长期暴露，应换成带过期与吊销的认证方式。
